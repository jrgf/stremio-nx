name: Build NRO

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nro-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/nxjs/package-lock.json
      - name: Install app and runtime dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix runtime/nxjs --no-audit --no-fund
      - name: Check types and playback regressions
        run: |
          npm run typecheck
          npm run host-test:unit
          node host-test/player-check.mjs
          node host-test/video-render-check.mjs
      - name: Build and verify the NRO
        run: |
          mkdir -p artifacts
          npm run build:nro > artifacts/build.log 2>&1 || { tail -n 100 artifacts/build.log; exit 1; }
          cp stremio-nx.nro LICENSE COPYRIGHT THIRD_PARTY_NOTICES.txt LICENSE_REVIEW.md artifacts/
          git archive --format=tar.gz --output=artifacts/project-source.tar.gz HEAD
      - name: Upload NRO, notices and project source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stremio-nx-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nro-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      BUILD_RUN_ID: ${{ github.run_id }}
      BUILD_ARTIFACT: stremio-nx-${{ github.sha }}
    steps:
      - name: Download verified build
        run: gh run download "$BUILD_RUN_ID" --name "$BUILD_ARTIFACT" --dir artifacts
      - name: Attach NRO and supporting files to GitHub release
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/stremio-nx.nro artifacts/SHA256SUMS artifacts/build-info.json \
            artifacts/LICENSE artifacts/COPYRIGHT artifacts/THIRD_PARTY_NOTICES.txt \
            artifacts/LICENSE_REVIEW.md artifacts/project-source.tar.gz --clobber
