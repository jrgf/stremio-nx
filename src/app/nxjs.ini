; Torrent player runtime config. The socket buffer pool is
; sb_efficiency x (tcp_tx_buf_max + tcp_rx_buf_max + udp bufs), and every
; socket takes tcp_tx_buf_size + tcp_rx_buf_size from it at creation, so
; smaller initial buffers and the maximum efficiency mean more concurrent peers.
[socket]
tcp_tx_buf_size = 16384
tcp_rx_buf_size = 65536
tcp_tx_buf_max_size = 131072
tcp_rx_buf_max_size = 524288
sb_efficiency = 8

; Loopback hardening: a few extra libuv workers so a blocked media/network open
; (which holds one worker while it probes) can't starve the pool that the
; loopback control server and fs/crypto ops share. Costs ~1 MiB stack each.
[threadpool]
size = 6


; A larger young generation: the player's short-lived buffers die in cheap
; scavenges instead of being promoted and paid for in 300 ms mark-compacts.
[v8]
flags = --max-semi-space-size=32

